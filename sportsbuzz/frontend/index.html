<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SportsBuzz | Real-time Sports Intelligence</title>
  <meta name="description"
    content="SportsBuzz provides real-time play-by-play commentary, live scores, and deep matching insights for football, cricket, and basketball." />
  <meta name="keywords"
    content="sports, live commentary, real-time scores, football, cricket, basketball, sports news" />

  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://sportsbuzz.live/" />
  <meta property="og:title" content="SportsBuzz | Real-time Sports Intelligence" />
  <meta property="og:description"
    content="Experience sports like never before with real-time play-by-play updates and dynamic scoreboards." />
  <meta property="og:image" content="/og-image.png" />

  <!-- Twitter -->
  <meta property="twitter:card" content="summary_large_image" />
  <meta property="twitter:title" content="SportsBuzz | Real-time Sports Intelligence" />
  <meta property="twitter:description" content="Real-time play-by-play commentary and live scores." />

  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "SportsBuzz",
      "url": "https://sportsbuzz.live/",
      "logo": "https://sportsbuzz.live/favicon.svg",
      "description": "Premium Sports Intelligence Hub providing live commentary and scores."
    }
  </script>
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "SportsBuzz",
      "url": "https://sportsbuzz.live/",
      "potentialAction": {
        "@type": "SearchAction",
        "target": "https://sportsbuzz.live/search?q={search_term_string}",
        "query-input": "required name=search_term_string"
      }
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
